name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MicDeck.sln

      - name: Build
        run: dotnet build MicDeck.sln -c Release --no-restore

      - name: Publish single file
        run: >
          dotnet publish src/MicDeck/MicDeck.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:ReadyToRun=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=embedded
          -o dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: MicDeck-win-x64
          path: dist/MicDeck.exe
          if-no-files-found: error
