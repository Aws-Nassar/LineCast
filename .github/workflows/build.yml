name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore LineCast.sln

      - name: Build
        run: dotnet build LineCast.sln -c Release --no-restore

      - name: Publish single file
        run: >
          dotnet publish src/LineCast/LineCast.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:ReadyToRun=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=embedded
          -o dist

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: LineCast-win-x64
          path: dist/LineCast.exe
          if-no-files-found: error
