name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained exe
        run: >
          dotnet publish src/MicDeck/MicDeck.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:ReadyToRun=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=embedded
          -o dist

      - name: Check the asset
        run: |
          $file = Get-Item dist/MicDeck.exe
          if ($file.Length -lt 20MB) {
              throw "Self-contained publish looks wrong: $($file.Length) bytes"
          }
          Write-Host "MicDeck.exe is $([math]::Round($file.Length / 1MB, 1)) MB"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create $env:GITHUB_REF_NAME dist/MicDeck.exe
          --title "MicDeck $env:GITHUB_REF_NAME"
          --generate-notes
